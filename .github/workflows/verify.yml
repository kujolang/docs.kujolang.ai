name: Verify documentation site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
      - uses: actions/checkout@v4
        with:
          repository: kujolang/ssg
          ref: 7d3439c32aecf58a845ff5335380d2af93a3cdb0
          path: ssg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed Kujo release
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Build and validate complete documentation
        working-directory: docs
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: bash tests/site-contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/output/
          include-hidden-files: true
          if-no-files-found: error
