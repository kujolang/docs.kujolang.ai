name: Verify documentation site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
      - uses: actions/checkout@v4
        with:
          repository: kujolang/ssg
          ref: a2f33f2df95ce45b6dd9151a48853f765df70792
          path: ssg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed Kujo release
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@a91702682e2969a66938b561b8059034ab2bc717
        with:
          version: v1.9.0
      - name: Build and validate complete documentation
        working-directory: docs
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: bash tests/site-contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/output/
          include-hidden-files: true
          if-no-files-found: error
