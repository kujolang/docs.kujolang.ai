<!DOCTYPE html>
<html lang="{{lang}}" data-theme="kujo-light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script>
		(function() {
			try {
				if (window.localStorage.getItem('sk-theme') === 'kujo-dark') {
					document.documentElement.dataset.theme = 'kujo-dark';
				}
			} catch (error) {}
		})();
	</script>
	<title>{{page_title}}</title>
	<meta name="description" content="{{meta_description}}">
	<meta name="keywords" content="{{seo_keywords}}">
	<meta name="author" content="Kujo">
	{{canonical_tag}}
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="mask-icon" href="/assets/img/kujo-logomark-black.svg" color="#000000">
	<link rel="manifest" href="/site.webmanifest">
	<meta name="application-name" content="Kujo Docs">
	<meta name="apple-mobile-web-app-title" content="Kujo Docs">
	<meta name="msapplication-TileColor" content="#ffffff">
	<meta name="msapplication-config" content="/browserconfig.xml">
	<meta name="theme-color" content="#ffffff">
	<meta property="og:title" content="{{seo_title}}">
	<meta property="og:description" content="{{seo_description}}">
	<meta property="og:url" content="{{og_url}}">
	<meta property="og:type" content="{{og_type}}">
	<meta property="og:site_name" content="Kujo Docs">
	{{og_image_tag}}
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{seo_title}}">
	<meta name="twitter:description" content="{{seo_description}}">
	{{twitter_image_tag}}
	<link href="{{relative_path}}assets/css/fonts.css" rel="stylesheet">
	<link href="{{relative_path}}assets/sitekit/sitekit.css" rel="stylesheet">
	<link href="{{stylesheet_path}}" rel="stylesheet">
	{{json_ld}}
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="docs-topbar" id="navigation">
	<div class="docs-topbar-row">
		<a class="docs-brand" href="{{home_path}}"><img class="docs-brand-mark" src="{{relative_path}}assets/img/kujo-logomark-black.svg" alt=""> <span>Docs</span></a>
		<label class="docs-search-shell">
			<span class="sr-only">Search documentation</span>
			<input id="docs-search" type="search" placeholder="Search docs" autocomplete="off">
		</label>
		<div class="docs-header-actions">
			<button class="docs-theme-button docs-icon-button" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-docs-theme>
				<svg class="docs-moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.132 0 .263 .003 .393 .008a7.5 7.5 0 0 0 7.599 9.6A9 9 0 1 1 12 3"/></svg>
				<svg class="docs-sun-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12m-4 0a4 4 0 1 0 8 0 4 4 0 1 0-8 0M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
			</button>
			<button class="docs-menu-button docs-icon-button" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open menu" data-docs-menu>
				<svg class="docs-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
				<svg class="docs-close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
			</button>
		</div>
	</div>
	<nav id="primary-navigation" class="docs-primary-nav" aria-label="Primary navigation">
		<a href="/start-here/">Start here</a>
		<a href="/learn/">Learn Kujo</a>
		<a href="/build/">Build with Kujo</a>
		<a href="/ecosystem/providers/">Providers</a>
		<a href="/tools/">Tools</a>
		<a href="/showcases/">Showcases</a>
	</nav>
</header>
<div id="docs-search-results" class="docs-search-results" aria-live="polite"></div>
{{content}}
<footer class="docs-footer" id="footer">
	<div class="docs-footer-brand"><a href="https://kujolang.ai"><img src="{{relative_path}}assets/img/kujo-logomark-black.svg" alt=""><strong>Kujo</strong></a><span>Docs v1.2.0</span></div>
	<nav aria-label="Footer navigation"><a href="/reference/">Reference</a><a href="/support/">Support</a><a href="/release-boundaries/">Release boundaries</a><a href="/llms.txt">llms.txt</a></nav>
</footer>
<script src="{{relative_path}}assets/sitekit/sitekit.js"></script>
<script src="{{relative_path}}assets/js/docs.js"></script>
</body>
</html>
